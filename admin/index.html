<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Kitobmarkazi</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div id="app">
  <!-- Login -->
  <div id="loginPage" class="login-page">
    <div class="login-card">
      <div class="login-logo" style="display:flex;justify-content:center;align-items:center;margin-bottom:16px"><i data-lucide="book-open" style="width:48px;height:48px;color:var(--teal)"></i></div>
      <h1>Kitobmarkazi Admin</h1>
      <p class="login-sub">Boshqaruv paneliga kirish</p>
      <div class="field"><label>Login</label><input type="text" id="loginUser" placeholder="admin"></div>
      <div class="field"><label>Parol</label><input type="password" id="loginPass" placeholder="••••••"></div>
      <button class="btn-primary" onclick="doLogin()">Kirish →</button>
      <div id="loginErr" class="login-err"></div>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" style="display:none">
    <div class="sb-overlay" id="sbOverlay" onclick="toggleMobileNav()"></div>
    <nav class="sidebar" id="sidebar">
      <div class="sb-brand"><i data-lucide="shield" style="width:20px;height:20px;color:var(--teal);margin-right:8px;vertical-align:middle"></i> <span>ADMIN</span></div>
      <a class="sb-link on" data-page="overview" onclick="showPage('overview',this);closeMobileNav()"><i data-lucide="bar-chart-3" style="width:16px;height:16px;margin-right:8px;vertical-align:middle"></i> Umumiy</a>
      <a class="sb-link" data-page="orders" onclick="showPage('orders',this);closeMobileNav()"><i data-lucide="shopping-cart" style="width:16px;height:16px;margin-right:8px;vertical-align:middle"></i> Buyurtmalar</a>
      <a class="sb-link" data-page="books" onclick="showPage('books',this);closeMobileNav()"><i data-lucide="book-open" style="width:16px;height:16px;margin-right:8px;vertical-align:middle"></i> Kitoblar</a>
      <a class="sb-link" data-page="publishers" onclick="showPage('publishers',this);closeMobileNav()"><i data-lucide="building-2" style="width:16px;height:16px;margin-right:8px;vertical-align:middle"></i> Nashriyotlar</a>
      <a class="sb-link" data-page="reviews" onclick="showPage('reviews',this);closeMobileNav()"><i data-lucide="message-square" style="width:16px;height:16px;margin-right:8px;vertical-align:middle"></i> Fikrlar</a>

      <a class="sb-link" data-page="promos" onclick="showPage('promos',this);closeMobileNav()"><i data-lucide="gift" style="width:16px;height:16px;margin-right:8px;vertical-align:middle"></i> Promokodlar</a>
      <a class="sb-link" data-page="coming" onclick="showPage('coming',this);closeMobileNav()"><i data-lucide="clock" style="width:16px;height:16px;margin-right:8px;vertical-align:middle"></i> Tez kunda</a>
      <a class="sb-link" data-page="settings" onclick="showPage('settings',this);closeMobileNav()"><i data-lucide="settings" style="width:16px;height:16px;margin-right:8px;vertical-align:middle"></i> Sozlamalar</a>

      <div class="sb-foot">
        <a href="/" target="_blank"><i data-lucide="globe" style="width:14px;height:14px;margin-right:6px;vertical-align:middle"></i> Saytga o'tish</a>
        <a onclick="logout()"><i data-lucide="log-out" style="width:14px;height:14px;margin-right:6px;vertical-align:middle"></i> Chiqish</a>
      </div>
    </nav>
    <main class="main">
      <div class="topbar">
        <button class="mob-burger" id="mobBurger" onclick="toggleMobileNav()"><span></span><span></span><span></span></button>
        <h2 id="pageTitle">Umumiy ko'rinish</h2>
        <span class="topbar-user" id="topUser">Admin</span>
      </div>
      <div class="content" id="content"></div>
    </main>
  </div>
  <!-- Toast container -->
  <div class="admin-toast" id="adminToast"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="/admin/admin.js"></script>
</body>
</html>
